name: Staging Deployment

on:
  workflow_dispatch:
    inputs:
      promote_to_production:
        description: "Run manual promotion gate after staging smoke checks."
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - "frontend/**"
    paths:
      - "velo-frontend/**"
      - "velo-platform/**"
      - ".github/workflows/staging-deploy.yml"

concurrency:
  group: staging-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: testpostgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: user
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testpostgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: velo-frontend/package-lock.json

      - name: Use Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22
          cache: maven

      - name: Install frontend dependencies
        working-directory: velo-frontend
        run: npm ci

      - name: Frontend lint
        working-directory: velo-frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: velo-frontend
        run: npm run typecheck

      - name: Frontend unit tests
        working-directory: velo-frontend
        run: npm run test:unit

      - name: Frontend contract tests
        working-directory: velo-frontend
        run: npm run test:contracts

      - name: Frontend build
        working-directory: velo-frontend
        run: npm run build

      - name: Create Flyway migration test database
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb --username=postgres testpostgres_flyway
          docker exec "${{ job.services.postgres.id }}" psql --username=postgres --dbname=testpostgres_flyway --command="CREATE EXTENSION IF NOT EXISTS postgis"

      - name: Backend tests
        working-directory: velo-platform
        run: ./mvnw -q test

  deploy-staging:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_ADMIN_URL }}
    env:
      STAGING_DEPLOY_TARGET: ${{ vars.STAGING_DEPLOY_TARGET }}
      STAGING_ADMIN_URL: ${{ vars.STAGING_ADMIN_URL }}
      STAGING_RIDER_URL: ${{ vars.STAGING_RIDER_URL }}
      STAGING_DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate staging configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for key in STAGING_DEPLOY_TARGET STAGING_ADMIN_URL STAGING_RIDER_URL STAGING_DEPLOY_TOKEN; do
            if [ -z "${!key}" ]; then
              missing+=("${key}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Staging deployment failed. Missing required configuration: %s\n' "${missing[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing staging deployment configuration: ${missing[*]}"
            exit 1
          fi

      - name: Trigger staging deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error \
            --request POST "$STAGING_DEPLOY_TARGET" \
            --header "Authorization: Bearer $STAGING_DEPLOY_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"repository\":\"$GITHUB_REPOSITORY\",\"ref\":\"$GITHUB_REF\",\"sha\":\"$GITHUB_SHA\"}"
          printf 'Deployment trigger accepted for %s at %s.\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  staging-smoke:
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_ADMIN_URL: ${{ vars.STAGING_ADMIN_URL }}
      STAGING_RIDER_URL: ${{ vars.STAGING_RIDER_URL }}
    steps:
      - name: Run staging smoke checks
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error "$STAGING_ADMIN_URL/login" > /dev/null
          curl --location --fail --silent --show-error "$STAGING_RIDER_URL" > /dev/null
          printf 'Admin login and rider landing page smoke checks passed.\n' >> "$GITHUB_STEP_SUMMARY"

  production-promotion-gate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_to_production == true }}
    needs: staging-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      # Promotion gate scaffold:
      # Keep this job environment-protected with required reviewers before enabling production deploy.
      - name: Hold for manual promotion
        run: |
          echo "Staging checks passed. Manual approval required for production promotion."
          echo "Add production deploy commands after environment protection is configured."
