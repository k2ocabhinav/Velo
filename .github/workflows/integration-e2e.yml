name: Frontend Backend Integration

on:
  pull_request:
    paths:
      - "velo-frontend/**"
      - "velo-platform/**"
      - ".github/workflows/integration-e2e.yml"
  push:
    branches:
      - main
      - "frontend/**"
    paths:
      - "velo-frontend/**"
      - "velo-platform/**"
      - ".github/workflows/integration-e2e.yml"
  workflow_dispatch:
    inputs:
      run_rider_e2e:
        description: "Run rider Playwright smoke suite (requires rider app routes to be fully wired)."
        required: false
        type: boolean
        default: false

concurrency:
  group: integration-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start compose stack and run handshake checks
        run: docker compose --project-directory . -f velo-frontend/docker-compose.e2e.yml up --build --abort-on-container-exit --exit-code-from smoke

      - name: Tear down compose stack
        if: always()
        run: docker compose --project-directory . -f velo-frontend/docker-compose.e2e.yml down -v

  playwright-admin-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: velo-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: velo-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright admin smoke
        run: npm run test:e2e -- --project=admin-chromium

  playwright-rider-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_rider_e2e == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: velo-frontend
    env:
      PLAYWRIGHT_ENABLE_RIDER: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: velo-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Promotion gate note:
      # Keep rider Playwright smoke behind manual workflow_dispatch until rider app page contracts
      # are complete and stable in CI.
      - name: Run Playwright rider smoke
        run: npm run test:e2e -- --project=rider-chromium
