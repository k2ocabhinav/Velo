name: Frontend Backend Integration

on:
  pull_request:
    paths:
      - "velo-frontend/**"
      - "velo-platform/**"
      - ".github/workflows/integration-e2e.yml"
  workflow_dispatch:

concurrency:
  group: integration-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start compose stack and run handshake checks
        run: docker compose -f velo-frontend/docker-compose.e2e.yml up --build --abort-on-container-exit --exit-code-from smoke

      - name: Tear down compose stack
        if: always()
        run: docker compose -f velo-frontend/docker-compose.e2e.yml down -v
