name: Frontend Backend Integration

on:
  pull_request:
    paths:
      - "velo-frontend/**"
      - "velo-platform/**"
      - ".github/workflows/integration-e2e.yml"
  push:
    branches:
      - main
      - "frontend/**"
    paths:
      - "velo-frontend/**"
      - "velo-platform/**"
      - ".github/workflows/integration-e2e.yml"
  workflow_dispatch:

concurrency:
  group: integration-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure clean compose state
        run: docker compose --project-directory . -f velo-frontend/docker-compose.e2e.yml down -v --remove-orphans || true

      - name: Run handshake checks (mutation pass)
        run: VELO_HANDSHAKE_MODE=mutate docker compose --project-directory . -f velo-frontend/docker-compose.e2e.yml up --build --abort-on-container-exit --exit-code-from smoke

      - name: Run handshake checks (post-restart persistence verification)
        # The local profile repairs the demo fixtures on every boot, which would erase the
        # mutation this pass is verifying, so disable that repair for the restarted stack.
        run: VELO_HANDSHAKE_MODE=verify-persisted VELO_DEMO_FIXTURE_REFRESH=false docker compose --project-directory . -f velo-frontend/docker-compose.e2e.yml up --abort-on-container-exit --exit-code-from smoke

      - name: Tear down compose stack
        if: always()
        run: docker compose --project-directory . -f velo-frontend/docker-compose.e2e.yml down -v

  playwright-admin-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: velo-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: velo-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright admin smoke
        run: npm run test:e2e -- --project=admin-chromium

  playwright-admin-webkit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: velo-frontend
    env:
      PLAYWRIGHT_INCLUDE_WEBKIT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: velo-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright WebKit browser
        run: npx playwright install --with-deps webkit

      - name: Run Playwright admin webkit smoke
        run: npm run test:e2e -- --project=admin-webkit

  playwright-driver-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: velo-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: velo-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright driver smoke
        run: npm run test:e2e -- --project=driver-chromium

  playwright-rider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: velo-frontend
    env:
      PLAYWRIGHT_ENABLE_RIDER: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: velo-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Required gate: rider Playwright smoke runs in CI alongside the other integration checks.
      - name: Run Playwright rider smoke
        run: npm run test:e2e -- --project=rider-chromium
