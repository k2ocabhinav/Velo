name: Backend Quality

on:
  pull_request:
    paths:
      - "velo-platform/**"
      - ".github/workflows/backend-quality.yml"
  push:
    branches:
      - main
      - "frontend/**"
    paths:
      - "velo-platform/**"
      - ".github/workflows/backend-quality.yml"
  workflow_dispatch:

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Backend tests (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Asia/Kolkata]
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: testpostgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: user
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testpostgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Create Flyway migration test database
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb --username=postgres testpostgres_flyway
          docker exec "${{ job.services.postgres.id }}" psql --username=postgres --dbname=testpostgres_flyway --command="CREATE EXTENSION IF NOT EXISTS postgis"

      - name: Run backend tests
        working-directory: velo-platform
        env:
          TZ: ${{ matrix.tz }}
        run: ./mvnw -q test -Duser.timezone="${{ matrix.tz }}"
