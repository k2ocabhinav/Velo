name: Security Checks

on:
  pull_request:
    paths:
      - "velo-frontend/**"
      - "velo-platform/**"
      - ".github/workflows/security.yml"
  push:
    branches:
      - main
      - "frontend/**"
    paths:
      - "velo-frontend/**"
      - "velo-platform/**"
      - ".github/workflows/security.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: security-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: velo-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: velo-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  backend-dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      DEPENDENCY_CHECK_PLUGIN_VERSION: 12.2.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Check NVD API key (optional; NVD-backed steps are skipped when absent)
        id: nvd-key
        shell: bash
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=NVD_API_KEY not set::OWASP dependency-check needs a free NVD API key for fast, reliable NVD update downloads. Request one at https://nvd.nist.gov/developers/request-an-api-key and add it as the repository secret NVD_API_KEY, then re-run this workflow. Skipping the NVD-backed dependency-check steps until it is configured."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute dependency-check cache key
        if: steps.nvd-key.outputs.present == 'true'
        id: odc-cache-key
        shell: bash
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache dependency-check data
        if: steps.nvd-key.outputs.present == 'true'
        env:
          ODC_DATA_DIR: ${{ runner.temp }}/dependency-check-data
        uses: actions/cache@v4
        with:
          path: ${{ env.ODC_DATA_DIR }}
          key: ${{ runner.os }}-odc-data-v1-${{ steps.odc-cache-key.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-odc-data-v1-

      - name: Warm OWASP NVD cache
        if: steps.nvd-key.outputs.present == 'true'
        working-directory: velo-platform
        env:
          ODC_DATA_DIR: ${{ runner.temp }}/dependency-check-data
        run: ./mvnw -q -DdataDirectory="$ODC_DATA_DIR" "org.owasp:dependency-check-maven:$DEPENDENCY_CHECK_PLUGIN_VERSION:update-only"

      - name: Run OWASP dependency check (no update)
        if: steps.nvd-key.outputs.present == 'true'
        working-directory: velo-platform
        env:
          ODC_DATA_DIR: ${{ runner.temp }}/dependency-check-data
        run: ./mvnw -q -DdataDirectory="$ODC_DATA_DIR" -DautoUpdate=false "org.owasp:dependency-check-maven:$DEPENDENCY_CHECK_PLUGIN_VERSION:check"

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: velo-platform/target/dependency-check-report.html
          if-no-files-found: ignore
