name: Frontend Quality

on:
  pull_request:
    paths:
      - "velo-frontend/**"
      - ".github/workflows/frontend-quality.yml"
  push:
    branches:
      - main
      - "frontend/**"
    paths:
      - "velo-frontend/**"
      - ".github/workflows/frontend-quality.yml"
  workflow_dispatch:

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: velo-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: velo-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Contract tests
        run: npm run test:contracts

      - name: Build
        run: npm run build
