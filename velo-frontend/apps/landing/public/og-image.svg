  <text x="744" y="178" fill="#1C2230" font-family="Arial, sans-serif" font-size="23" font-weight="700">Sample day</text>
  <text x="744" y="223" fill="#596170" font-family="Arial, sans-serif" font-size="18">05:40</text>
  <text x="744" y="286" fill="#596170" font-family="Arial, sans-serif" font-size="18">09:15</text>
  <text x="744" y="349" fill="#596170" font-family="Arial, sans-serif" font-size="18">18:30</text>
  <path d="M825 217H1090M825 280H1090M825 343H1090" stroke="#C9CFD8" stroke-width="3"/>
  <path d="M871 217H1012M871 280H1062M871 343H986" stroke="#1A56FF" stroke-width="6" stroke-linecap="round"/>
  <circle cx="871" cy="217" r="9" fill="#1A56FF"/>
  <circle cx="1012" cy="217" r="9" fill="#2A9D8F"/>
  <circle cx="871" cy="280" r="9" fill="#1A56FF"/>
  <circle cx="1062" cy="280" r="9" fill="#2A9D8F"/>
