  <circle cx="986" cy="343" r="9" fill="#2A9D8F"/>
  <text x="744" y="403" fill="#4D5563" font-family="Arial, sans-serif" font-size="15">Airport · Grand Hotel · Business park</text>
  <text x="76" y="570" fill="#596170" font-family="Arial, sans-serif" font-size="18">Bookings, driver assignments and live trip updates in one web workspace.</text>
