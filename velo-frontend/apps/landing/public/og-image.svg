<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Velo dispatch desk</title>
  <desc id="description">A dispatch desk for pre-booked business and hotel transfers, anywhere.</desc>
  <rect width="1200" height="630" fill="#F4F6F9"/>
  <path d="M0 514H1200" stroke="#C9CFD8" stroke-width="2"/>
  <text x="76" y="91" fill="#1C2230" font-family="Arial, sans-serif" font-size="42" font-weight="700">Velo</text>
  <circle cx="169" cy="77" r="5" fill="#1A56FF"/>
  <text x="76" y="220" fill="#1C2230" font-family="Arial, sans-serif" font-size="54" font-weight="700">A dispatch desk for</text>
  <text x="76" y="282" fill="#1C2230" font-family="Arial, sans-serif" font-size="54" font-weight="700">pre-booked transfers.</text>
  <text x="78" y="344" fill="#4D5563" font-family="Arial, sans-serif" font-size="23">For fleets of 10 to 50 vehicles, anywhere.</text>
  <text x="78" y="387" fill="#4D5563" font-family="Arial, sans-serif" font-size="21">Pre-launch. Working demo available.</text>
