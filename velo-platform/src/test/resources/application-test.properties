spring.application.name=velo-platform

#DB configuration - test database
spring.datasource.url=jdbc:postgresql://localhost:5432/testpostgres
spring.datasource.username=postgres
spring.datasource.password=user
spring.datasource.hikari.connection-init-sql=CREATE EXTENSION IF NOT EXISTS postgis
spring.datasource.hikari.maximum-pool-size=2
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration,classpath:db/demo-migration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.data.redis.repositories.enabled=false

# JWT config
jwt.secret=testSecretKeyForJWTTokenGenerationThatIsLongEnoughForHS512Algorithm123456789
jwt.expiration=900000
app.security.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003
app.auth.rate-limit.redis-enabled=false
app.auth.rate-limit.ip-limit=1000
app.auth.rate-limit.account-limit=1000
management.endpoints.web.exposure.include=health,env
management.health.redis.enabled=false

# Scheduled Ride Configuration
app.scheduled-ride.min-advance-minutes=30
app.scheduled-ride.max-advance-days=7
app.scheduled-ride.dispatch-window-minutes=15
app.scheduled-ride.dispatch-enabled=false
