spring.application.name=velo-platform
spring.profiles.default=local

# Platform Configuration
app.platform.commission-rate=0.30
app.platform.driver-rating-threshold=4.8

# Geocoding provider defaults; environment and profile files can override each value.
app.geocoding.base-url=${GEOCODING_BASE_URL:http://localhost:7070}
app.geocoding.user-agent=${GEOCODING_USER_AGENT:VeloPlatform/1.0 (geocoding)}
app.geocoding.email=${GEOCODING_EMAIL:}
app.geocoding.country-bias=${GEOCODING_COUNTRY_BIAS:}
app.geocoding.timeout=${GEOCODING_TIMEOUT:3s}
app.geocoding.cache-ttl=${GEOCODING_CACHE_TTL:24h}

# Fare Configuration
app.fare.base-fare=5.0
app.fare.per-km-rate=2.0
app.fare.surge-start-hour=18
app.fare.surge-end-hour=21
app.fare.surge-multiplier=2.0
app.fare.high-rated-rider-threshold=4.8

# Database and JWT settings are supplied by the selected profile or environment.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
velo.dispatch.offer-ttl-seconds=45
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=${VELO_PROMETHEUS_ENABLED:false}
management.prometheus.metrics.export.enabled=${VELO_PROMETHEUS_ENABLED:false}
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.data.redis.repositories.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_ACCESS_TTL_MS:900000}
app.security.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Auth session and rate-limit defaults
auth.refresh-token.ttl=PT720H
auth.refresh-token.rotation-grace-window=PT20S
auth.refresh-token.revoked-retention=PT720H
auth.refresh-token.cleanup-interval-ms=3600000
auth.refresh-token.cleanup-batch-size=500
app.auth.rate-limit.enabled=true
app.auth.rate-limit.redis-enabled=true
app.auth.rate-limit.window=PT1M
app.auth.rate-limit.ip-limit=60
app.auth.rate-limit.account-limit=10
app.auth.rate-limit.trusted-proxies=${VELO_AUTH_TRUSTED_PROXIES:}

# Scheduled Ride Configuration
app.scheduled-ride.min-advance-minutes=30
app.scheduled-ride.max-advance-days=7
app.scheduled-ride.dispatch-window-minutes=15
app.scheduled-ride.dispatch-interval-ms=60000
app.scheduled-ride.recurring-materialization-horizon-days=7
app.scheduled-ride.recurring-materialization-interval-ms=300000
app.scheduled-ride.unassigned-alert-window-minutes=60
app.scheduled-ride.unassigned-alert-interval-ms=60000

# Keep springdoc's webjar lookup aligned with the overridden swagger-ui dependency version.
springdoc.swagger-ui.version=5.32.1
