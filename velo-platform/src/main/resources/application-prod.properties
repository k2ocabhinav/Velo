springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.flyway.locations=classpath:db/migration
management.endpoints.web.exposure.include=health,prometheus
app.auth.rate-limit.ip-limit=30
app.auth.rate-limit.account-limit=8
server.forward-headers-strategy=framework
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.ssl.enabled=true
app.geocoding.base-url=${GEOCODING_BASE_URL}
app.geocoding.user-agent=${GEOCODING_USER_AGENT:VeloPlatform/1.0 (production geocoding)}
app.geocoding.email=${GEOCODING_EMAIL:}
app.geocoding.country-bias=${GEOCODING_COUNTRY_BIAS:}
app.geocoding.timeout=${GEOCODING_TIMEOUT:3s}
