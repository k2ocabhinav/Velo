spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?useSSL=false
spring.datasource.username=postgres
spring.datasource.password=user
spring.datasource.hikari.connection-init-sql=CREATE EXTENSION IF NOT EXISTS postgis
jwt.secret=changeThisJwtSecretKeyForLocalDevelopmentOnly1234567890
jwt.expiration=${JWT_ACCESS_TTL_MS:900000}
spring.flyway.locations=classpath:db/migration,classpath:db/demo-migration
app.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4100,http://localhost:4101,http://localhost:4102,http://localhost:4103,http://localhost:3000,\
http://localhost:5700,http://localhost:5701,http://localhost:5702,http://localhost:5703,\
http://default.localhost:4100,http://default.localhost:4101,http://default.localhost:4102,http://default.localhost:4103,\
http://default.localhost:5700,http://default.localhost:5701,http://default.localhost:5702,http://default.localhost:5703,\
http://saffron-routes.localhost:4100,http://saffron-routes.localhost:4101,http://saffron-routes.localhost:4102,http://saffron-routes.localhost:4103,\
http://saffron-routes.localhost:5700,http://saffron-routes.localhost:5701,http://saffron-routes.localhost:5702,http://saffron-routes.localhost:5703}
app.auth.rate-limit.ip-limit=120
app.auth.rate-limit.account-limit=15
app.geocoding.base-url=${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
app.geocoding.user-agent=${GEOCODING_USER_AGENT:VeloPlatform/1.0 (local rider and dispatch address search)}
app.geocoding.email=${GEOCODING_EMAIL}
app.geocoding.country-bias=${GEOCODING_COUNTRY_BIAS:in}
app.geocoding.timeout=${GEOCODING_TIMEOUT:3s}
app.scheduled-ride.recurring-materialization-enabled=false
