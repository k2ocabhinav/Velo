spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
jwt.secret=${JWT_SECRET:}
app.security.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.auth.rate-limit.ip-limit=60
app.auth.rate-limit.account-limit=10
spring.flyway.locations=classpath:db/migration,classpath:db/demo-migration
app.geocoding.base-url=${GEOCODING_BASE_URL:http://localhost:7070}
app.geocoding.user-agent=${GEOCODING_USER_AGENT:VeloPlatform/1.0 (dev geocoding)}
app.geocoding.email=${GEOCODING_EMAIL:}
app.geocoding.country-bias=${GEOCODING_COUNTRY_BIAS:in}
app.geocoding.timeout=${GEOCODING_TIMEOUT:3s}
